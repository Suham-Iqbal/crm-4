<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams CRM</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
 
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
 
  <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

  <div class="toast-container position-fixed top-0 end-0 p-3"></div>

  <nav class="navbar navbar-expand-lg bg-dark navbar-dark border-bottom shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand fw-bolder text-primary" href="#">CRM</a>
      <div class="d-flex w-50 mx-auto">
        <input class="form-control me-2" id="searchInput" type="search" placeholder="Search sections" aria-label="Search">
      </div>
      <div class="d-flex align-items-center">
       
        <button id="theme-toggle" class="btn btn-outline-light btn-sm me-3">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
        
        <div class="dropdown">
          <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="bi bi-person-circle fs-4 me-2"></i>
            <span id="userName" class="fw-bold">User</span>
          </a>
          <ul class="dropdown-menu dropdown-menu-end shadow">
            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
            <li><a class="dropdown-item" href="#"><i class="bi bi-sliders me-2"></i>Preferences</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><button id="logoutBtn" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Logout</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <div id="app-container" class="d-flex" stylemaile="height: calc(100vh - 56px);">
  
    <aside id="miniSidebar" class="bg-white text-white p-2 d-flex flex-column align-items-center" style="width: 60px;">
   
    </aside>

    <aside id="subSidebar" class="bg-light border-end p-3" style="width: 250px; min-width: 150px; max-width: 500px;">
      <h6 class="fw-bold mb-3 p-2 text-dark">Select a Module</h6>
      <ul id="subList" class="list-group list-group-flush"></ul>
    </aside>

    <div id="dragHandle" class="drag-handle"></div>

    <main id="mainContent" class="flex-grow-1 bg-white">
      <div class="d-flex justify-content-between align-items-center border-bottom p-3 bg-light">
        <button id="expandBtn" class="btn btn-outline-primary btn-sm">
          <i class="bi bi-arrows-fullscreen"></i>
        </button>
        <h5 id="mainContentHeader" class="mb-0 fw-semibold text-dark">CRM Dashboard</h5>
      </div>
      <div id="dataDisplay" class="p-4">

        <div id="generalChatContainer" class="chat-container">
          <div class="chat-messages" id="chat-messages"></div>
          <form class="chat-input-form" id="chat-form">
            <input type="text" id="chat-input" class="form-control" placeholder="Type a message..." autocomplete="off">
            <button type="submit" class="btn btn-primary ms-2"><i class="bi bi-send-fill"></i></button>
          </form>
        </div>

        <div id="privateChatContainer" class="private-chat-container" style="display: none;">
          
          <div class="chat-container">
            
            <div class="sidebar">
              <div class="sidebar-header">
                <div class="app-logo">
                  <div class="logo-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                  </div>
                  <span class="app-name">ChatFlow</span>
                </div>
                <div class="search-container">
                  <input type="text" class="search-input" placeholder="Search chats..." id="chatSearchInput">
                  <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                  </svg>
                </div>
              </div>
              <div class="chats-list" id="modernChatsList">
                <!-- Chat items will be populated here -->
              </div>
            </div>

            <div class="chat-main">
              <div class="chat-header" id="modernChatHeader">
                <div class="contact-avatar">
                  <div class="avatar-placeholder">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                      <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                  </div>
                </div>
                <div class="contact-info">
                  <div class="contact-name" id="modernContactName">Select a chat</div>
                  <div class="contact-status" id="modernContactStatus">
                    <span class="status-dot"></span>
                    <span>Choose a user to start chatting</span>
                  </div>
                </div>
                <div class="header-actions">
                  <button class="action-btn" id="themeToggleBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <circle cx="12" cy="12" r="5"></circle>
                      <line x1="12" y1="1" x2="12" y2="3"></line>
                      <line x1="12" y1="21" x2="12" y2="23"></line>
                      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                      <line x1="1" y1="12" x2="3" y2="12"></line>
                      <line x1="21" y1="12" x2="23" y2="12"></line>
                      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                  </button>
                </div>
              </div>
              
              <div class="messages-container" id="modernMessagesContainer">
                <div class="welcome-message">
                  <div class="welcome-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                  </div>
                  <h3>Welcome to ChatFlow 2025</h3>
                  <p>Select a user from the sidebar to start chatting</p>
                </div>
              </div>
              
              <div class="input-area">
                <div class="input-container">
                  <textarea class="message-input" id="modernMessageInput" placeholder="Type a message..." rows="1"></textarea>
                  <div class="input-actions">
                    <button class="input-btn" id="emojiBtn">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                        <line x1="9" y1="9" x2="9.01" y2="9"></line>
                        <line x1="15" y1="9" x2="15.01" y2="9"></line>
                      </svg>
                    </button>
                    <button class="input-btn" id="attachmentBtn">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                      </svg>
                    </button>
                    <button class="send-btn" id="modernSendBtn">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22,2 15,22 11,13 2,9"></polygon>
                      </svg>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Right Sidebar -->
          
          <!-- Back button for compatibility -->
          <button class="btn btn-link mt-2" id="back-to-users">&larr; Back to Users</button>
        </div>

        <div id="activitySection">
          <h5 class="fw-semibold text-dark">Activity Log</h5>
          <form id="addActivityForm" class="mb-3 d-flex">
            <input type="text" id="activityInput" class="form-control me-2" placeholder="Add an activity..." required>
            <button type="submit" class="btn btn-primary">Add</button>
          </form>
          <ul id="activityList" class="list-group"></ul>
        </div>
      </div>
    </main>
  </div>

  <div class="modal fade" id="userManagementModal" tabindex="-1" aria-labelledby="userManagementModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="userManagementModalLabel">User Management</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="userManagementModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="script.js"></script>
</body>
</html>
